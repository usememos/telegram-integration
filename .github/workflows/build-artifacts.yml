name: Build artifacts

on:
  push:
    tags:
      - "[1-9][0-9].*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate calendar release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release_version.sh version "$RELEASE_TAG"
      - name: Find previous stable release
        run: echo "GORELEASER_PREVIOUS_TAG=$(bash scripts/release_version.sh previous-tag .)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
