name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: sh scripts/build.sh
      - run: ./build/memogram --version
      - run: go generate ./...
      - run: git diff --exit-code -- openapi internal/memosapi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Build the linter with the module's Go version; release binaries can lag
      # behind and refuse to analyze newer language versions.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall

  memos-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memos: ["canary", "0.30.0", "0.31.0"]
    services:
      memos:
        image: neosmemo/memos:${{ matrix.memos }}
        env:
          MEMOS_MODE: prod
        ports:
          - 5230:5230
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -run '^TestMemosIntegration$' -count=1 -timeout=3m -v ./internal/bot
        env:
          MEMOS_TEST_URL: http://127.0.0.1:5230

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          install-only: true
      - run: goreleaser check
      - run: python3 scripts/test-release.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/build.sh docker -t memogram:ci
      - run: python3 scripts/test-container.py memogram:ci
