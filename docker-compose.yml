services:
  memogram:
    build:
      context: .
      args:
        VERSION: ${MEMOGRAM_VERSION:-}
        COMMIT: ${MEMOGRAM_COMMIT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA: /data/data.txt
    volumes:
      - memogram-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  memogram-data:
